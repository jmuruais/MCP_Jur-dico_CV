[Service]
# Conserva ExecStart, entorno, identificadores y secretos del túnel existente.
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
MemoryHigh=256M
MemoryMax=320M
TasksMax=64
CPUQuota=80%
LimitNOFILE=1024
TimeoutStopSec=20
